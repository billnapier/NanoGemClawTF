name: Build NanoGemClaw Container

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'NanoGemClaw source repository'
        required: false
        default: 'Rlin1027/NanoGemClaw'
        type: string
  pull_request:
    paths:
      - '.github/workflows/build-container.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NanoGemClawTF Repository
        uses: actions/checkout@v4

      - name: Checkout NanoGemClaw Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || 'Rlin1027/NanoGemClaw' }}
          path: nanogemclaw-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./nanogemclaw-src
          push: false
          tags: nanogemclaw:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
