name: Build NanoGemClaw Container

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/build-container.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NanoGemClawTF Repository
        uses: actions/checkout@v4

      - name: Checkout NanoGemClaw Source Code
        uses: actions/checkout@v4
        with:
          repository: 'billnapier/NanoGemClaw'
          path: nanogemclaw-src

      - name: Ensure Dockerfile Exists
        run: |
          if [ ! -f nanogemclaw-src/Dockerfile ]; then
            echo "Creating default Dockerfile for NanoGemClaw..."
            cat << 'EOF' > nanogemclaw-src/Dockerfile
          FROM node:20-slim AS builder
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run build || true
          RUN npm run build:dashboard || true

          FROM node:20-slim
          WORKDIR /app
          ENV NODE_ENV=production
          ENV DASHBOARD_HOST=0.0.0.0
          RUN apt-get update && apt-get install -y ffmpeg && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /app ./
          EXPOSE 8080 3000
          CMD ["npx", "tsx", "src/index.ts"]
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanogemclaw
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./nanogemclaw-src
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
